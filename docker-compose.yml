version: "3.9"

services:
  app:
    build: .
    container_name: notification-service

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3

    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
